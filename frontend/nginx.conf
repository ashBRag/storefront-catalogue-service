# Serves the built SPA and forwards /api to the backend, so the browser only ever
# talks to this one origin (no CORS). Loaded into nginx's http {} block.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Docker's embedded DNS. Resolving "api" per request (via the variable below)
  # means nginx starts even if the api container isn't up yet, and follows it
  # if it restarts with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # --- API: proxied as-is (the backend sets its own security headers) ---
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so a client can't spoof its IP to dodge the
    # backend's per-IP enquiry rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  # --- Hashed build assets: the file name changes when the content does ---
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    # No "always": a 404 for a missing asset must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --- Everything else: real files, or index.html for client-side routes ---
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    # Always revalidate, so a new deploy is picked up on the next load.
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
