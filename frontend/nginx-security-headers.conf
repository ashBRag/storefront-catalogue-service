# Security headers for pages and static assets. Included in each location because
# nginx drops inherited add_header directives when a location adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Product images come from URLs in API responses (any https host), so img-src is
# https: rather than a named host. Everything else is same-origin only.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
